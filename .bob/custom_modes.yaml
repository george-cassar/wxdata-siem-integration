      ### Frontend Build Rules

      **Carbon Design = skill + MCP, in that order (MANDATORY):**
      Carbon Design is driven by TWO paired assets that you MUST use together:
      - the **`carbon-mcp` skill** — the know-how: tool routing, size conventions, follow-up
        protocols, and output/citation rules. INVOKE IT FIRST, before any Carbon code.
      - the **`carbon-mcp` MCP server** (carbon-mcp-config.json, IBM Carbon Design System,
        v1.10+) — the data: authoritative, version-correct Carbon v11 component code, props,
        icons, docs, and chart source.
      The skill gives you the rules; the MCP gives you the answers. Loading the MCP tools
      without the skill's routing rules, or paraphrasing this section from memory instead of
      invoking the skill, is NOT compliant. Do NOT reconstruct component props or style
      imports from memory — that is what broke the CSS. The MCP exposes exactly THREE tools
      (the skill explains exactly when to reach for each):

      1. `docs_search(query, size?, filters?)` — design, usage, style, accessibility, and
         getting-started DOCS. Docs chunks are small; `size: 3` is usually needed. Optional
         `filters` e.g. `{component_id, page_type}`. Use for: Sass/styling setup, theming
         (g90), grid, tokens, a11y, and "how should X be used".
      2. `code_search(query, size?, filters?)` — actual React/Web Components CODE examples,
         icons, and pictograms. Default `size: 2`. Query with the SPECIFIC component name
         (not "example"/"implementation"). Strong filters: `{component_type: "React",
         component_id, variant_id}`. Use for: exact import paths + prop usage of every
         component you place (Header/SideNav shell, DataTable, Tile, Tag, Select, etc.).
         When a variant shows `example_omitted:true`, re-call with its `requery_hint` at
         `size: 1`. Do NOT use code_search for charts (see below).
      3. `get_charts(framework, chart_type, variant?, mode?, data?, options?, include_interfaces?)`
         — THE ONLY authoritative tool for Carbon Charts (replaces @carbon/charts-react
         guesswork). `framework: "react"`. 2-call convention: `mode: "schema"` to see data
         shape + variants, then `mode: "full"` for source. Use the response fields VERBATIM:
         `install_command` (terminal), `styles_import` (add as a TOP-LEVEL import in the app
         entry module — NEVER inside SCSS or as @use/@import), `import_hint`, `usage_hint`.

      Workflow each session: (0) INVOKE the `carbon-mcp` skill before touching the frontend;
      then (1) `docs_search` the Sass/getting-started setup for `index.scss`/theme; (2) for
      every component `code_search` its exact props; (3) for every chart use `get_charts`.
      Prefer these over recall in all cases.

      **Availability & fallback (the only sanctioned reason to skip skill/MCP):**
      If the `carbon-mcp` skill is not installed/registered in this Bob (Agentic IDE)
      instance, OR the `carbon-mcp` MCP is not connected (placeholder
      `Bearer YOUR-CARBON-API-HERE` / `X-MCP-Session` in the config, or an expired IBM token
      — they expire ~2h), you MUST: (a) state plainly to the user which asset is unavailable
      and why, (b) recommend they install the skill / refresh the token + session, and
      (c) fall back to the carbondesignsystem.com docs — NOT to memory — and flag every
      Carbon API you could not verify as unverified. NEVER claim the skill/MCP was used when
      it was not. Note: if the MCP client doesn't send cookies, the `X-MCP-Session` header is
      REQUIRED on every request; tokens auto-refresh when possible, and if refresh fails the
      user must re-run the auth flow for a new auth code + session ID.

      **Carbon MCP element coverage map — EVERY mandated element is sourced from the MCP.**
      For each component below, `code_search` with the given `component_id` (filter
      `component_type:"React"`) to get exact imports + props; for charts use `get_charts`.
      Verified `component_id` slugs (carbon-mcp v1.10):
      - App.jsx UI shell (Header, HeaderName, HeaderNavigation, HeaderGlobalBar, SideNav,
        SkipToContent) → `code_search` `component_id: uishell`
      - DemoBanner (InlineNotification) → `component_id: notification`
      - KPICard (Tile) → `component_id: tile`
      - DataTableView (DataTable, TableToolbar, search, batch) → `component_id: data-table`;
        loading skeleton → `component_id: data-table-skeleton`
      - Pagination → `component_id: pagination`
      - Status/confidence Tags → `component_id: tag`
      - Model/scenario Select → `component_id: dropdown`
      - Submit/Regenerate/Export Buttons → `component_id: button`
      - SolutionPage ProgressIndicator → `component_id: progress-indicator`
      - Loading/empty states (skeletons) → `component_id: skeleton-text` (+ Loading)
      - AIResponsePanel building blocks (CodeSnippet, CopyButton, Tag) → `code_search` each
        by name with `component_type:"React"`
      - ALL charts (ChartPanel: area, donut, bar, line, etc.) → `get_charts(framework:"react",
        chart_type, mode:"schema"→"full")`; wire `styles_import` as a top-level JS import
      - Icons (@carbon/icons-react) and pictograms → `code_search` by icon name
      - Theme g90 / grid / `index.scss` Sass setup → `docs_search` getting-started + styling
      Do not introduce a Carbon element you did NOT retrieve from the MCP. If a component
      isn't in this map, look it up with `code_search` by name before using it.

