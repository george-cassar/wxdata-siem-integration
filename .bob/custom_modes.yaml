      **Dockerfile.backend:**
      - UBI9 python-311, pip install, uvicorn on 8000

      ### Container Build Standards (deployment-target aware)

      Selection is driven by the MANDATORY DEPLOY_TARGET / BUILD_ARCH answers.
      Stamp both into a header at the TOP of every Dockerfile and into README, e.g.:
        `# DEPLOY_TARGET: code-engine`
        `# BUILD_ARCH: arm64`

      **Pattern A — OpenShift / ROKS (UBI 9, REQUIRED for this target).**
      Runs cleanly under OpenShift's restricted SCC (random high UID, GID 0).
      Pin runtime to amd64; build stage may use $BUILDPLATFORM to avoid Apple Silicon
      QEMU/esbuild crashes:
      ```dockerfile
      # DEPLOY_TARGET: openshift
      # BUILD_ARCH: arm64   (set to amd64 if building on Intel/AMD/Linux)
      # Build stage runs on the builder's native arch — avoids QEMU/esbuild crashes on Apple Silicon
      FROM --platform=$BUILDPLATFORM registry.access.redhat.com/ubi9/nodejs-20 AS builder
      WORKDIR /opt/app-root/src
      COPY package*.json ./
      RUN npm ci
      COPY . .
      RUN npm run build
      # Runtime stage pinned to the cluster's arch
      FROM --platform=linux/amd64 registry.access.redhat.com/ubi9/nginx-124
      COPY --from=builder /opt/app-root/src/dist /usr/share/nginx/html
      ```
      Backend equivalent: build/runtime on
      `registry.access.redhat.com/ubi9/python-311`, runtime pinned to linux/amd64.

      **Pattern B — IBM Cloud Code Engine ONLY (alpine/slim permitted).**
      NEVER use this pattern when DEPLOY_TARGET=openshift — these images assume root
      and fixed write paths and will fail under OpenShift's random-UID SCC.
      `$BUILDPLATFORM` keeps the build stage native (no QEMU); the runtime FROM is
      pinned to linux/amd64 so the shipped image actually runs on the cluster:
      ```dockerfile
      # DEPLOY_TARGET: code-engine
      # BUILD_ARCH: arm64
      # Build on native platform to avoid QEMU/esbuild crashes on Apple Silicon
      FROM --platform=$BUILDPLATFORM node:20-alpine AS builder
      WORKDIR /app
      COPY package*.json ./
      RUN npm ci
      COPY . .
      RUN npm run build
      FROM --platform=linux/amd64 nginx:1.27-alpine
      COPY --from=builder /app/dist /usr/share/nginx/html
      ```
      Backend equivalent:
      ```dockerfile
      # DEPLOY_TARGET: code-engine
      # BUILD_ARCH: arm64
      FROM --platform=linux/amd64 python:3.11-slim
      ```

      **Apple Silicon build commands (document in README whenever BUILD_ARCH=arm64).**
      `FROM --platform=$BUILDPLATFORM` alone does NOT set the final image arch — the
      build command flag is still required:
      ```bash
      docker build --platform linux/amd64 -t <image> -f Dockerfile.frontend .
      podman build --platform linux/amd64 -t <image> -f Dockerfile.frontend .
      ```
      For docker-compose, add `platform: linux/amd64` under each service, or build
      with `DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose build`.

      ### Scripts

      **setup.sh:** Check node/python3, copy .env.example, npm install, pip install, generate data
      **verify-demo.sh:** Automated build+boot smoke test (see BUILD VERIFICATION section). Backend: create venv, `pip install -r requirements.txt`, boot uvicorn, `curl -fsS` /api/health + key endpoints (expect 200). Frontend: `npm ci || npm install`, then `npm run build` (MUST exit 0 — this catches Sass/Carbon import + JSX errors), then boot the dev/preview server and `curl -fsS` the root. Exit non-zero on any failure so the build→fix loop and check-compliance can gate on it.
      **check-compliance.sh:** Verify docs exist, no .env in git, no hardcoded keys, Carbon in deps, no eval(), synthetic disclaimer, no real emails. Read the `# DEPLOY_TARGET:` / `# BUILD_ARCH:` header from each Dockerfile and enforce target-aware base/arch rules:
      - DEPLOY_TARGET=openshift → grep for `ubi9/` in every FROM; alpine/slim/non-UBI = HARD FAIL.
      - DEPLOY_TARGET=code-engine + alpine/slim → require `--platform=$BUILDPLATFORM` on the build stage.
      - DEPLOY_TARGET≠local + BUILD_ARCH=arm64 → require a `--platform=linux/amd64` runtime FROM AND a `--platform linux/amd64` build command documented in README; missing = HARD FAIL.
      - Missing/absent DEPLOY_TARGET header → HARD FAIL (the mandatory question was skipped).


