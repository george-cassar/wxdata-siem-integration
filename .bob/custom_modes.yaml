      # ===== BUILD VERIFICATION & SELF-TEST (MANDATORY — run before handover) =====

      Generating code is HALF the job. You MUST run what you build, observe it working,
      and fix your own errors in-session. The user should receive a demo that already
      boots and renders — not a first draft they have to debug with repeated "fix error in
      terminal / fix error in frontend" prompts. Treat the verify→fix loop as part of the
      build, not an optional extra: it is far cheaper to self-correct now than to ship
      broken and round-trip with the user.

      ## The build → run → read-errors → fix loop (repeat until green)
      For each stage below: run it, READ the actual output, and if it fails, diagnose and
      fix, then re-run. Keep looping (budget ~5 attempts per stage). If a stage still fails
      after honest effort, STOP and report the exact error text + what you tried — never
      paper over a red build or claim "done".

      ### Stage 1 — Backend boots and serves
      - Create/activate a venv; `pip install -r backend/requirements.txt` (fix missing/
        conflicting deps in requirements.txt and re-install).
      - Boot it in the background: `uvicorn main:app --port 8000` (run_in_background).
      - `curl -fsS http://localhost:8000/api/health` → expect 200 + `{status, mode}`.
      - Hit the real endpoints the frontend calls: `/api/data/dashboard`, `/api/data/records`,
        `/api/ai/models`, and POST `/api/ai/generate`. Any non-200 / traceback → fix the
        router/service and re-run. Confirm it runs in **mock mode with zero credentials**.

      ### Stage 2 — Frontend builds (this catches most Carbon CSS breakage cheaply)
      - `cd frontend && (npm ci || npm install)` — fix any missing dependency in
        package.json (e.g. `sass`, `@carbon/*`, `@carbon/charts`/`@carbon/charts-react`).
      - `npm run build` — this MUST exit 0. A real Vite build compiles the SCSS and resolves
        every import, so it surfaces: wrong `@use '@carbon/react'`/`@carbon/styles` order,
        missing Sass deps, bad component import paths, and JSX errors — exactly the failures
        users were hand-fixing. On any error: re-query `carbon-mcp` for the correct import/
        prop/Sass setup, fix, and rebuild. Do NOT proceed while the build is red.

      ### Stage 3 — App runs and renders (visual + console verification)
      - Boot the dev/preview server (`npm run dev`, run_in_background) with the backend up.
      - Using the **browser/preview tooling**, load the app and navigate ALL 5 routes
        (`/`, `/problem`, `/solution`, `/results`, `/architecture`).
      - For each route: capture the **browser console** and assert ZERO uncaught errors and
        no failed CSS/asset requests; take a **screenshot**.
      - Inspect each screenshot: Carbon must actually be STYLED (IBM Plex font, g90 dark
        theme, proper spacing/grid) — NOT raw unstyled HTML. Unstyled output = a styling/
        import bug → fix `index.scss`/theme via `carbon-mcp` and re-verify.
      - Exercise the "wow moment": trigger a preset scenario on SolutionPage and confirm the
        AIResponsePanel renders a (mock) response without console errors.
      - Confirm charts render (not blank) and the DataTable shows rows + working CSV export.

      ### Stage 4 — Containers (only if you built Dockerfiles)
      - At minimum `docker build` (or `podman build`) each image to prove it builds; for
        arm64→amd64 targets use the documented `--platform linux/amd64`. A failed image
        build is a HARD FAIL — fix the Dockerfile, don't ship it untested.

      ## Agent demos (watsonx Orchestrate)
      The equivalent self-test is the skill §3.6 gate already in the Agent/Hybrid track:
      `orchestrate agents list` must show the agent and `orchestrate chat ask -n <agent> …
      -r` must return on-topic output with the expected tool called. Same principle: prove
      it runs before handover.

      ## What "verified" means (report honestly)
      Only claim done when: backend health + endpoints return 200 in mock mode; `npm run
      build` exits 0; all 5 pages load with zero console errors and visibly-correct Carbon
      styling (screenshots captured); preset scenario + charts + table work. Report status
      plainly — "built, runs, and verified (screenshots attached)" or, if blocked, the exact
      failing stage and error. A demo that has not completed Stages 1–3 is NOT done.


