      ### Docker & Deployment

      **docker-compose.yml:**
      - frontend: Dockerfile.frontend, port 3000, depends_on backend
      - backend: Dockerfile.backend, port 8000, env_file .env, DEMO_MODE=mock

      **Dockerfile.frontend:**
